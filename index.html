<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rodrigo Alemany</title>

    <meta name="description" content="Rodrigo Alemany — Camera Crew & Photography">

    <style>

        /* =========================

           CONFIGURACIÓN GENERAL

           ========================= */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        html {

            scroll-behavior: smooth;

        }

        body {

            background: #061426;

            color: white;

            font-family: Arial, Helvetica, sans-serif;

        }

        a {

            color: inherit;

            text-decoration: none;

        }

        /* =========================

           PORTADA

           ========================= */

        .home {

            height: 100vh;

            min-height: 600px;

            position: relative;

            background-image:

                linear-gradient(

                    rgba(3, 18, 35, 0.18),

                    rgba(3, 18, 35, 0.18)

                ),

                url("fondo.jpg");

            background-size: cover;

            background-position: center;

            display: flex;

            flex-direction: column;

        }

        /* =========================

           NOMBRE

           ========================= */

        .name {

            position: absolute;

            top: 9.5%;

            left: 50%;

            transform: translateX(-50%);

            font-size: clamp(18px, 1.8vw, 30px);

            font-weight: 300;

            letter-spacing: 0.55em;

            white-space: nowrap;

            text-align: center;

        }

        /* =========================

           MENÚ PRINCIPAL

           ========================= */

        .menu {

            position: absolute;

            top: 49%;

            left: 0;

            width: 100%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 0 4.3%;

        }

        .menu a {

            font-size: clamp(15px, 1.5vw, 25px);

            font-weight: 300;

            letter-spacing: 0.55em;

            white-space: nowrap;

            transition: opacity 0.3s ease;

        }

        .menu a:hover {

            opacity: 0.45;

        }

        /* =========================

           SECCIONES

           ========================= */

        .section {

            min-height: 100vh;

            padding: 120px 7vw;

            background: #061426;

        }

        .section h2 {

            font-size: clamp(45px, 8vw, 120px);

            font-weight: 300;

            letter-spacing: 0.08em;

            margin-bottom: 80px;

        }

        .section p {

            max-width: 850px;

            font-size: 20px;

            line-height: 1.7;

            color: rgba(255,255,255,0.7);

        }

        /* =========================

           CAMERA CREW

           ========================= */

        #camera {

            background: #050f1d;

        }

        /* =========================

           PHOTOGRAPHY

           ========================= */

        #photography {

            background: #08192c;

        }

        /* =========================

           CONTACTO

           ========================= */

        #contact {

            min-height: 70vh;

            background: #030b14;

            display: flex;

            flex-direction: column;

            justify-content: center;

        }

        .contact-email {

            font-size: clamp(25px, 4vw, 60px);

            font-weight: 300;

            letter-spacing: 0.05em;

            margin-top: 20px;

        }

        .contact-email:hover {

            opacity: 0.5;

        }

        /* =========================

           MÓVIL

           ========================= */

        @media (max-width: 700px) {

            .home {

                min-height: 100vh;

                background-position: center;

            }

            .name {

                top: 10%;

                font-size: 15px;

                letter-spacing: 0.38em;

            }

            .menu {

                top: 50%;

                transform: translateY(-50%);

                flex-direction: column;

                gap: 45px;

                padding: 0;

            }

            .menu a {

                font-size: 15px;

                letter-spacing: 0.35em;

            }

            .section {

                padding: 100px 25px;

            }

            .section h2 {

                margin-bottom: 50px;

            }

        }

    </style>

</head>

<body>

    <!-- =========================

         PORTADA

         ========================= -->

    <main class="home" id="home">

        <div class="name">

            RODRIGO ALEMANY

        </div>

        <nav class="menu">

            <a href="#camera">

                CAMERA CREW

            </a>

            <a href="#photography">

                PHOTOGRAPHY

            </a>

            <a href="#contact">

                CONTACT

            </a>

        </nav>

    </main>

    <!-- =========================

         CAMERA CREW

         ========================= -->

    <section class="section" id="camera">

        <h2>

            CAMERA CREW

        </h2>

        <p>

            Camera operator and cinematography work for

            advertising, documentary, short films and music videos.

        </p>

    </section>

    <!-- =========================

         PHOTOGRAPHY

         ========================= -->

    <section class="section" id="photography">

        <h2>

            PHOTOGRAPHY

        </h2>

        <p>

            Photography projects, portraits, editorial work

            and personal projects.

        </p>

    </section>

    <!-- =========================

         CONTACT

         ========================= -->

    <section class="section" id="contact">

        <h2>

            CONTACT

        </h2>

        <a

            class="contact-email"

            href="mailto:TUEMAIL@EMAIL.COM"

        >

            TUEMAIL@EMAIL.COM

        </a>

    </section>

</body>

</html>
